name: Build SM8450 Custom Kernel

on:
  workflow_dispatch:

concurrency:
  group: kernel-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0
        with:
          lfs: true
          submodules: recursive
          fetch-depth: 0

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@4c1955f5a8f2771a8f4da9d31f6882f8f33f70a4
        with:
          root-reserve-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential flex \
            libssl-dev libncurses-dev \
            zip unzip cpio rsync git \
            dwarves elfutils pahole

      - name: Execute Build Script
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_kernel_GKI.sh
          ./build_kernel_GKI.sh

      - name: Collect artifacts
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/kernel artifacts/modules

          mapfile -t IMAGES < <(find out -type f -name 'Image' 2>/dev/null || true)
          if [ ${#IMAGES[@]} -eq 0 ]; then
            echo "No kernel Image found under out/**/Image"
            exit 1
          fi
          for img in "${IMAGES[@]}"; do
            rel="${img#out/}"
            mkdir -p "artifacts/kernel/$(dirname "$rel")"
            cp -av "$img" "artifacts/kernel/$rel"
          done

          mapfile -t MODULES < <(find out -type f -name '*.ko' 2>/dev/null || true)
          if [ ${#MODULES[@]} -eq 0 ]; then
            echo "No .ko modules found under out/**/*.ko"
            exit 1
          fi
          for ko in "${MODULES[@]}"; do
            rel="${ko#out/}"
            mkdir -p "artifacts/modules/$(dirname "$rel")"
            cp -av "$ko" "artifacts/modules/$rel"
          done

          {
            echo "Kernel Images:"
            printf '%s\n' "${IMAGES[@]}"
            echo
            echo "Kernel Modules:"
            printf '%s\n' "${MODULES[@]}"
          } > artifacts/manifest.txt

      - name: Upload Kernel Artifacts
        if: success()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: Tab-S8-Kernel-and-Modules-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
