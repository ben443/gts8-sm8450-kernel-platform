name: Build Samsung GKI Kernel (gts8-a14)

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Samsung build target"
        required: false
        default: "gts8wifi_eur_open"
      clean_build:
        description: "Wipe out/ before building"
        type: boolean
        required: false
        default: false
  push:
    branches: [ "main" ]
    paths:
      - "build_kernel_GKI.sh"
      - "kernel_platform/**"
      - "vendor/**"
      - ".github/workflows/build-gki-kernel.yml"

concurrency:
  group: gki-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    env:
      BUILD_TARGET: ${{ github.event.inputs.build_target || 'gts8wifi_eur_open' }}
      CHIPSET_NAME: waipio
      LC_ALL: C
      LANG: C

    steps:
      - name: Reclaim disk space
        run: |
          echo "=== before ==="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/.ghcup || true
          sudo docker image prune -a -f || true
          sudo apt-get clean
          echo "=== after ==="
          df -h /

      - name: Add swap (8G)
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          sudo sysctl -w vm.swappiness=80
          free -h

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          lfs: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential curl flex git git-lfs gnupg gperf \
            libelf-dev liblz4-tool libncurses5 libncurses5-dev libssl-dev \
            libxml2 libxml2-utils lzop rsync zip unzip zlib1g-dev \
            python3 python3-pip python-is-python3 jq ca-certificates \
            dwarves cpio kmod device-tree-compiler
          git lfs install || true
          echo "--- versions ---"
          bison --version | head -1
          flex --version
          pahole --version || true

      - name: Verify repository layout
        shell: bash
        run: |
          set +e
          FAIL=0
          echo "=== top level ==="
          ls -la

          echo
          echo "=== kernel_platform ==="
          if [ -d kernel_platform ]; then
            ls -d kernel_platform/*/ 2>/dev/null
          else
            echo "MISSING: kernel_platform/"; FAIL=1
          fi

          echo
          echo "=== vendor tree (must be SIBLING of kernel_platform) ==="
          if [ -d vendor/qcom/opensource ]; then
            ls -d vendor/qcom/opensource/*/ 2>/dev/null
          else
            echo "MISSING: vendor/qcom/opensource/"; FAIL=1
          fi

          echo
          echo "=== required DLKM sources ==="
          for m in datarmnet-ext/wlan datarmnet/core mmrm-driver \
                   audio-kernel camera-kernel display-drivers/msm; do
            if [ -d "vendor/qcom/opensource/$m" ]; then
              echo "  OK      vendor/qcom/opensource/$m"
            else
              echo "  MISSING vendor/qcom/opensource/$m"; FAIL=1
            fi
          done

          echo
          echo "=== build scripts ==="
          for f in build_kernel_GKI.sh kernel_platform/build/android/prepare_vendor.sh; do
            [ -f "$f" ] && echo "  OK      $f" || { echo "  MISSING $f"; FAIL=1; }
          done

          echo
          if [ "$FAIL" != "0" ]; then
            echo "::error::Repository layout is incomplete - see list above"
            exit 1
          fi
          echo "Layout OK"

      - name: Check for prebuilt toolchain
        id: toolchain
        shell: bash
        run: |
          set +e
          CLANG_DIR=$(ls -d kernel_platform/prebuilts/clang/host/linux-x86/clang-* 2>/dev/null | tail -1)
          if [ -n "$CLANG_DIR" ] && [ -x "$CLANG_DIR/bin/clang" ]; then
            echo "Found: $CLANG_DIR"
            "$CLANG_DIR/bin/clang" --version | head -2
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No clang under kernel_platform/prebuilts/clang/host/linux-x86/"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

          echo "--- other prebuilts ---"
          for p in build-tools kernel-build-tools gcc/linux-x86 \
                   clang-tools bison flex; do
            [ -e "kernel_platform/prebuilts/$p" ] \
              && echo "  OK      prebuilts/$p" \
              || echo "  MISSING prebuilts/$p"
          done

      # Only runs if the tree does NOT vendor its own clang.
      # Adjust the branch/tag to match your kernel's expected clang revision.
      - name: Fetch AOSP toolchain (fallback)
        if: steps.toolchain.outputs.present == 'false'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p kernel_platform/prebuilts/clang/host/linux-x86
          git clone --depth 1 -b android14-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            /tmp/aosp-clang
          rsync -a /tmp/aosp-clang/ kernel_platform/prebuilts/clang/host/linux-x86/
          rm -rf /tmp/aosp-clang/.git

          for repo in build-tools kernel-build-tools; do
            if [ ! -d "kernel_platform/prebuilts/$repo" ]; then
              git clone --depth 1 -b android14-release \
                "https://android.googlesource.com/platform/prebuilts/$repo" \
                "kernel_platform/prebuilts/$repo"
              rm -rf "kernel_platform/prebuilts/$repo/.git"
            fi
          done
          df -h /

      - name: Make scripts executable
        run: |
          chmod +x build_kernel_GKI.sh
          chmod +x kernel_platform/build/android/prepare_vendor.sh
          find kernel_platform/build -name "*.sh" -exec chmod +x {} \; || true

      - name: Clean out/ (optional)
        if: github.event.inputs.clean_build == 'true'
        run: rm -rf out/

      # SINGLE build invocation. build_kernel_GKI.sh internally calls
      # prepare_vendor.sh with RECOMPILE_KERNEL=1 - do NOT call it separately.
      - name: Build kernel
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./build_kernel_GKI.sh 2>&1 | tee build.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Summarise build log
        if: always()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          echo "### Build log tail" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "\$GITHUB_STEP_SUMMARY"
          tail -60 build.log >> "\$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo
          echo "=== errors ==="
          grep -nE "^(.*): (error|fatal error):|^make.*\*\*\*|modpost: .*undefined" \
            build.log | head -50 || echo "none"

      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          set +e
          OUT_DIR="${GITHUB_WORKSPACE}/out/msm-${CHIPSET_NAME}-${CHIPSET_NAME}-gki"
          mkdir -p artifacts

          echo "=== out/ tree (depth 3) ==="
          find out -maxdepth 3 -type d 2>/dev/null | head -60

          for d in "$OUT_DIR/dist" "$OUT_DIR/gki_kernel/dist"; do
            if [ -d "$d" ]; then
              name=$(echo "$d" | sed "s|$OUT_DIR/||; s|/|_|g")
              mkdir -p "artifacts/$name"
              cp -a "$d/." "artifacts/$name/"
              echo "collected: $d"
            fi
          done

          # kernel config + map, wherever they landed
          find out -maxdepth 5 $$ -name ".config" -o -name "System.map" $$ \
            -exec cp -n {} artifacts/ \; 2>/dev/null

          # any stray modules not already in dist/
          mkdir -p artifacts/modules
          find out -name "*.ko" -newer build.log -exec cp -n {} artifacts/modules/ \; 2>/dev/null
          rmdir artifacts/modules 2>/dev/null

          cp build.log artifacts/ 2>/dev/null

          echo
          echo "=== artifacts ==="
          du -sh artifacts/* 2>/dev/null
          du -sh artifacts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gts8-a14-gki-${{ github.run_number }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Final disk report
        if: always()
        run: |
          df -h /
          free -h
