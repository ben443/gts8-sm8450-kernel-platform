name: Build Samsung GKI Kernel (gts8-a14)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "build_kernel_GKI.sh"
      - "kernel_platform/**"
      - "vendor/**"
      - ".github/workflows/build-gki-kernel.yml"

concurrency:
  group: gki-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      BUILD_TARGET: gts8wifi_eur_open
      CHIPSET_NAME: waipio
      TARGET_PRODUCT: gki
      TARGET_BOARD_PLATFORM: gki

      # ccache settings
      USE_CCACHE: "1"
      CCACHE_COMPRESS: "1"
      CCACHE_COMPRESSLEVEL: "6"
      CCACHE_MAXSIZE: "20G"
      CCACHE_DIR: ${{ github.workspace }}/.ccache

      # Keep output deterministic in CI logs
      LC_ALL: C
      LANG: C

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Show disk space (before)
        run: |
          df -h
          free -h

      - name: Create swap (16G)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libelf-dev libgl1-mesa-dev liblz4-tool libncurses5 \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip python-is-python3 jq repo unzip ca-certificates \
            dwarves pahole
          git lfs install || true

      - name: Setup ccache in PATH
        run: |
          echo "/usr/lib/ccache" >> $GITHUB_PATH
          ccache --version
          ccache -M "${CCACHE_MAXSIZE}"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('**/build_kernel_GKI.sh', '**/*.mk', '**/*.bp', '**/Kconfig', '**/Makefile') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Export environment from build target
        shell: bash
        run: |
          set -e
          MODEL="$(echo "$BUILD_TARGET" | cut -d'_' -f1)"
          REGION="$(echo "$BUILD_TARGET" | cut -d'_' -f2)"
          CARRIER="$(echo "$BUILD_TARGET" | cut -d'_' -f3)"
          PROJECT_NAME="${MODEL}"
          TARGET_BUILD_VARIANT="user"

          ANDROID_BUILD_TOP="${GITHUB_WORKSPACE}"
          ANDROID_PRODUCT_OUT="${ANDROID_BUILD_TOP}/out/target/product/${MODEL}"
          OUT_DIR="${ANDROID_BUILD_TOP}/out/msm-${CHIPSET_NAME}-${CHIPSET_NAME}-${TARGET_PRODUCT}"

          KBUILD_EXTRA_SYMBOLS="${ANDROID_BUILD_TOP}/out/vendor/qcom/opensource/mmrm-driver/Module.symvers"
          MODNAME="audio_dlkm"
          KBUILD_EXT_MODULES="../vendor/qcom/opensource/datarmnet-ext/wlan \
            ../vendor/qcom/opensource/datarmnet/core \
            ../vendor/qcom/opensource/mmrm-driver \
            ../vendor/qcom/opensource/audio-kernel \
            ../vendor/qcom/opensource/camera-kernel \
            ../vendor/qcom/opensource/display-drivers/msm"

          {
            echo "MODEL=$MODEL"
            echo "PROJECT_NAME=$PROJECT_NAME"
            echo "REGION=$REGION"
            echo "CARRIER=$CARRIER"
            echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
            echo "ANDROID_BUILD_TOP=$ANDROID_BUILD_TOP"
            echo "TARGET_PRODUCT=$TARGET_PRODUCT"
            echo "TARGET_BOARD_PLATFORM=$TARGET_BOARD_PLATFORM"
            echo "ANDROID_PRODUCT_OUT=$ANDROID_PRODUCT_OUT"
            echo "OUT_DIR=$OUT_DIR"
            echo "KBUILD_EXTRA_SYMBOLS=$KBUILD_EXTRA_SYMBOLS"
            echo "MODNAME=$MODNAME"
            echo "KBUILD_EXT_MODULES=$KBUILD_EXT_MODULES"
            echo "USE_CCACHE=$USE_CCACHE"
            echo "CCACHE_DIR=$CCACHE_DIR"
          } >> "$GITHUB_ENV"

      - name: Print key build environment
        run: |
          env | grep -E '^(MODEL|PROJECT_NAME|REGION|CARRIER|TARGET_BUILD_VARIANT|ANDROID_BUILD_TOP|TARGET_PRODUCT|TARGET_BOARD_PLATFORM|ANDROID_PRODUCT_OUT|OUT_DIR|KBUILD_EXTRA_SYMBOLS|MODNAME|KBUILD_EXT_MODULES|USE_CCACHE|CCACHE_DIR)=' | sort

      - name: Make scripts executable
        run: |
          chmod +x build_kernel_GKI.sh || true
          chmod +x kernel_platform/build/android/prepare_vendor.sh || true

      # Samsung GKI prerequisite:
      # prepare_vendor.sh generates vendor interfaces/modules setup required before kernel compile.
      - name: Prepare vendor (Samsung/QCOM GKI flow)
        shell: bash
        run: |
          set -euxo pipefail
          RECOMPILE_KERNEL=1 ./kernel_platform/build/android/prepare_vendor.sh sec "${TARGET_PRODUCT}"

      # Build using your script (keeps your original logic)
      - name: Build kernel (from project script)
        shell: bash
        run: |
          set -euxo pipefail
          ./build_kernel_GKI.sh

      - name: ccache stats (post-build)
        if: always()
        run: |
          ccache -s || true

      - name: Collect artifacts
        if: always()
        shell: bash
        run: |
          set -e
          mkdir -p artifacts

          # Common Samsung/QCOM GKI output locations
          [ -d "$OUT_DIR" ] && rsync -a "$OUT_DIR/" artifacts/out_dir/ || true
          [ -d "$ANDROID_PRODUCT_OUT" ] && rsync -a "$ANDROID_PRODUCT_OUT/" artifacts/android_product_out/ || true
          [ -d "kernel_platform/out" ] && rsync -a "kernel_platform/out/" artifacts/kernel_platform_out/ || true

          # Grab key images/modules if present
          find . -type f \( \
            -name "Image" -o -name "Image.gz" -o -name "Image.lz4" -o \
            -name "bzImage" -o -name "vmlinux" -o \
            -name "*.ko" -o -name "System.map" -o \
            -name "boot.img" -o -name "vendor_boot.img" -o -name "dtbo.img" \
          \) -print0 | tar --null -T - -czf artifacts/key-build-products.tar.gz || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gts8-a14-gki-build-${{ github.run_number }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

      - name: Show disk space (after)
        if: always()
        run: |
          df -h
          free -h
