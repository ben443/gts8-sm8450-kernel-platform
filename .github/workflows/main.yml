name: Build GKI kernel for gts8wifi (Android 14 / U9)
on:
  push:
    branches: [main]               # adjust if your default branch is named differently
  pull_request:
    branches: [main]
  workflow_dispatch:               # ← this creates the “Run workflow” button

# --------------------------------------------------------------
# 2️⃣  Single job – runs on a native Arm64 runner (fast, no QEMU)
# --------------------------------------------------------------
jobs:
  build-gki:
    name: Native Arm64 GKI build
    runs-on: ubuntu-24.04-arm          # Arm64 hosted runner (GA)
    timeout-minutes: 120

    # ------------------------------------------------------------------
    # 3️⃣  Steps – everything the build needs, fully self‑contained
    # ------------------------------------------------------------------
    steps:
      # --------------------------------------------------------------
      # Checkout the kernel‑platform repo **with submodules**
      # --------------------------------------------------------------
      - name: Checkout kernel‑platform source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # --------------------------------------------------------------
      # Install the host packages the GKI build expects
      # --------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential libssl-dev flex bison libelf-dev \
            device-tree-compiler kmod python3 \
            gcc-aarch64-linux-gnu

      # --------------------------------------------------------------
      # Verify we really have an Arm64 tool‑chain
      # --------------------------------------------------------------
      - name: Show tool‑chain versions
        run: |
          clang --version
          aarch64-linux-gnu-gcc --version
          nproc

      # --------------------------------------------------------------
      # 4️⃣  Add the NetHunter fragment **once** (inline, no extra files)
      # --------------------------------------------------------------
      - name: Inject NetHunter fragment & module list
        run: |
          # ---- 4a. Create the fragment file -------------------------------------------------
          mkdir -p ${{ github.workspace }}/nethunter-fragments
          cat > ${{ github.workspace }}/nethunter-fragments/nethunter_defconfig <<'EOF'
# ---- NetHunter fragment (exact copy from the previous answer) ----
CONFIG_RTL8812AU=m
CONFIG_RTL8822BU=m
CONFIG_RTL8822CU=m
CONFIG_RTL8821CU=m
CONFIG_RTL8188EU=m
CONFIG_RTL8192EU=m
CONFIG_RTL8814AU=m
CONFIG_RTL8852AE=m
CONFIG_RTL8852BE=m
CONFIG_RTL8852CE=m
CONFIG_HID_RAW=m
CONFIG_USB_HID=m
CONFIG_USB_HIDDEV=m
CONFIG_NETFILTER_XT_MATCH_HASHLIMIT=m
CONFIG_NETFILTER_XT_MATCH_RECENT=m
CONFIG_NETFILTER_XT_TARGET_TPROXY=m
CONFIG_NETFILTER_XT_TARGET_TCPMSS=m
CONFIG_IP_NF_TARGET_TPROXY=m
CONFIG_IP6_NF_TARGET_TPROXY=m
CONFIG_NETFILTER_XT_MATCH_MARK=m
CONFIG_NETFILTER_XT_MATCH_CONNTRACK=m
CONFIG_NETFILTER_XT_MATCH_STATE=m
CONFIG_NETFILTER_XT_MATCH_OWNER=m
CONFIG_NETFILTER_XT_MATCH_PHYSDEV=m
CONFIG_NETFILTER_XT_MATCH_PKTTYPE=m
CONFIG_NETFILTER_XT_MATCH_QUOTA=m
CONFIG_NETFILTER_XT_MATCH_REALM=m
CONFIG_NETFILTER_XT_MATCH_SCTP=m
CONFIG_NETFILTER_XT_MATCH_TCPMSS=m
CONFIG_NETFILTER_XT_MATCH_TIME=m
CONFIG_NETFILTER_XT_MATCH_U32=m
CONFIG_NETFILTER_XT_TARGET_NFLOG=m
CONFIG_NETFILTER_XT_TARGET_NFQUEUE=m
CONFIG_NETFILTER_XT_TARGET_MARK=m
CONFIG_NETFILTER_XT_TARGET_CONNMARK=m
CONFIG_NETFILTER_XT_TARGET_DSCP=m
CONFIG_NETFILTER_XT_TARGET_HMARK=m
CONFIG_NETFILTER_XT_TARGET_IDLETIMER=m
CONFIG_NETFILTER_XT_TARGET_LED=m
CONFIG_NETFILTER_XT_TARGET_LOG=m
CONFIG_NETFILTER_XT_TARGET_NETMAP=m
CONFIG_NETFILTER_XT_TARGET_NOTRACK=m
CONFIG_NETFILTER_XT_TARGET_RATEEST=m
CONFIG_NETFILTER_XT_TARGET_REDIRECT=m
CONFIG_NETFILTER_XT_TARGET_TEE=m
CONFIG_NETFILTER_XT_TARGET_TOS=m
CONFIG_NETFILTER_XT_TARGET_TRACE=m
CONFIG_NETFILTER_XT_TARGET_TTL=m
CONFIG_NF_TABLES=m
CONFIG_NFT_CHAIN_ROUTE_IPV4=m
CONFIG_NFT_CHAIN_ROUTE_IPV6=m
CONFIG_NFT_NAT=m
CONFIG_NFT_MASQ=m
CONFIG_NFT_REDIR=m
CONFIG_IP_VS=m
CONFIG_IP_VS_PROTO_TCP=m
CONFIG_IP_VS_PROTO_UDP=m
CONFIG_IP_VS_PROTO_AH_ESP=m
CONFIG_IP_VS_PROTO_ESP=m
CONFIG_IP_VS_PROTO_AH=m
CONFIG_IP_VS_RR=m
CONFIG_IP_VS_WRR=m
CONFIG_IP_VS_LC=m
CONFIG_IP_VS_WLC=m
CONFIG_IP_VS_FO=m
CONFIG_IP_VS_OVF=m
CONFIG_IP_VS_LBLC=m
CONFIG_IP_VS_LBLCR=m
CONFIG_IP_VS_DH=m
CONFIG_IP_VS_SH=m
CONFIG_IP_VS_SED=m
CONFIG_IP_VS_NQ=m
CONFIG_NET_SCH_INGRESS=m
CONFIG_NET_SCH_FQ_CODEL=m
CONFIG_NET_CLS_ACT=m
CONFIG_NET_EMATCH_U32=m
CONFIG_NET_EMATCH_CMP=m
CONFIG_NET_EMATCH_NBYTE=m
CONFIG_NET_EMATCH_META=m
CONFIG_NET_EMATCH_TEXT=m
CONFIG_NET_EMATCH_CANID=m
CONFIG_NET_EMATCH_IPSET=m
CONFIG_NET_EMATCH_IPT=m
CONFIG_NET_CLS_BASIC=m
CONFIG_NET_CLS_TCINDEX=m
CONFIG_NET_CLS_ROUTE4=m
CONFIG_NET_CLS_FW=m
CONFIG_NET_CLS_U32=m
CONFIG_NET_CLS_RSVP=m
CONFIG_NET_CLS_RSVP6=m
CONFIG_NET_CLS_FLOW=m
CONFIG_NET_CLS_CGROUP=m
CONFIG_NET_CLS_BPF=m
CONFIG_NET_CLS_FLOWER=m
CONFIG_NET_CLS_MATCHALL=m
CONFIG_NET_EMATCH_STACK=32
CONFIG_NET_SCH_CBQ=m
CONFIG_NET_SCH_HTB=m
CONFIG_NET_SCH_HFSC=m
CONFIG_NET_SCH_ATM=m
CONFIG_NET_SCH_PRIO=m
CONFIG_NET_SCH_MULTIQ=m
CONFIG_NET_SCH_RED=m
CONFIG_NET_SCH_BLUE=m
CONFIG_NET_SCH_SFQ=m
CONFIG_NET_SCH_TEQL=m
CONFIG_NET_SCH_TBF=m
CONFIG_NET_SCH_GRED=m
CONFIG_NET_SCH_DSMARK=m
CONFIG_NET_SCH_NETEM=m
CONFIG_NET_SCH_DRR=m
CONFIG_NET_SCH_MQPRIO=m
CONFIG_NET_SCH_CHOKE=m
CONFIG_NET_SCH_QFQ=m
CONFIG_NET_SCH_CODEL=m
CONFIG_NET_SCH_FQ=m
CONFIG_NET_SCH_HHF=m
CONFIG_NET_SCH_PIE=m
CONFIG_NET_SCH_FQ_PIE=m
CONFIG_NET_SCH_PLUG=m
CONFIG_BLK_DEV_LOOP=m
CONFIG_BLK_DEV_LOOP_MIN_COUNT=8
CONFIG_OVERLAY_FS=m
CONFIG_OVERLAY_FS_REDIRECT_DIR=y
CONFIG_OVERLAY_FS_INDEX=y
CONFIG_OVERLAY_FS_XINO_AUTO=y
CONFIG_OVERLAY_FS_METACOPY=y
EOF

          # ---- 4b. Hook the fragment into the common GKI config ---------------------------
          cat >> kernel_platform/build.config <<'EOF'

# NetHunter fragment for gts8wifi (SM‑X700) – Android 14 GKI 5.10
KERNEL_DEFCONFIG_FRAGMENTS+= \
        ../../../../nethunter-fragments/nethunter_defconfig \
EOF

          # ---- 4c. Append NetHunter module names to the platform module‑order file -------
          cat >> kernel_platform/msm-kernel/modules.list.msm.waipio <<'EOF'

# NetHunter modules for gts8wifi (SM‑X700)
rtl8812au.ko
rtl8822bu.ko
rtl8822cu.ko
rtl8821cu.ko
rtl8188eu.ko
rtl8192eu.ko
rtl8814au.ko
hid_raw.ko
xt_TPROXY.ko
nft_nat.ko
nft_masq.ko
nft_redir.ko
overlay.ko
loop.ko
EOF

      # --------------------------------------------------------------
      # 5️⃣  Run the actual GKI build (the wrapper script supplied by the repo)
      # --------------------------------------------------------------
      - name: Build GKI kernel (gki_dist)
        run: |
          cd kernel_platform
          chmod +x build_kernel_GKI.sh
          ./build_kernel_GKI.sh

      # --------------------------------------------------------------
      # 6️⃣  Upload the flashable images as workflow artefacts
      # --------------------------------------------------------------
      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: gki-gts8wifi-${{ github.sha }}
          path: |
            kernel_platform/out/dist/boot.img
            kernel_platform/out/dist/vendor_boot.img
            kernel_platform/out/dist/vendor_dlkm.img
            kernel_platform/out/dist/Image.lz4
            kernel_platform/out/dist/dtb.img
